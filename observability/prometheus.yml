global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: flask
    metrics_path: /metrics
    static_configs:
      - targets: ["flask:5000"]
  - job_name: locust
    metrics_path: /metrics
    static_configs:
      - targets: ["locust:9646"]
  # Optional headless service enabled with the reports Compose profile.
  - job_name: locust_headless
    metrics_path: /metrics
    static_configs:
      - targets: ["loadtest:9646"]
