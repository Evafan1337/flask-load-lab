<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Магазин канцтоваров</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
  <header class="top">
    <div class="shell">
      <a class="store-name" href="#catalog">Канцтовары</a>
      <nav class="top-nav" aria-label="Разделы магазина">
        <a href="{{ url_for('documentation') }}">Документация</a>
        <a class="cart-link" href="#cart">Корзина <span id="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="shell layout">
    <section class="catalog" id="catalog" aria-labelledby="catalog-title">
      <h1 id="catalog-title">Товары</h1>
      <form class="controls" id="filters" role="search" aria-label="Поиск товаров">
        <label class="field">
          <span>Поиск</span>
          <input id="search" type="search" placeholder="Название товара" autocomplete="off" maxlength="100">
        </label>
        <label class="field">
          <span>Категория</span>
          <select id="category">
            <option value="">Все категории</option>
          </select>
        </label>
        <label class="field">
          <span>Сортировка</span>
          <select id="sort">
            <option value="default">По умолчанию</option>
            <option value="low">Сначала дешевле</option>
            <option value="high">Сначала дороже</option>
          </select>
        </label>
      </form>
      <p id="results-count" class="results" aria-live="polite">Загрузка товаров…</p>
      <ul id="products" class="products"></ul>
    </section>

    <aside class="cart" id="cart" aria-labelledby="cart-title">
      <h2 id="cart-title" tabindex="-1">Корзина</h2>
      <ul id="cart-items" class="cart-items"></ul>
      <p id="cart-empty" class="empty">Корзина пуста.</p>
      <div id="cart-summary" class="summary" hidden>
        <span>Итого</span>
        <strong id="cart-total">0 ₽</strong>
      </div>
      <button id="checkout" class="primary checkout" type="button" hidden>Оформить заказ</button>
      <p id="cart-error" class="message-error" role="alert"></p>
      <p id="receipt" class="receipt" role="status" hidden></p>
    </aside>
  </main>

  <p id="cart-status" class="sr-only" role="status"></p>

  <dialog id="order-dialog" aria-labelledby="order-title" aria-describedby="order-note">
    <h2 id="order-title">Подтверждение заказа</h2>
    <p id="order-note">Номер и сумма демо-заказа сохраняются в браузере.</p>
    <ul class="order-items" id="order-items"></ul>
    <div class="summary"><span>Итого</span><strong id="order-total"></strong></div>
    <p id="order-error" class="message-error" role="alert"></p>
    <form id="order-form" class="dialog-actions" method="dialog">
      <button id="order-cancel" class="secondary" value="cancel" autofocus>Отмена</button>
      <button id="order-confirm" class="primary" value="confirm">Подтвердить</button>
    </form>
  </dialog>

  <dialog id="product-dialog" aria-labelledby="product-title">
    <h2 id="product-title"></h2>
    <p id="product-description"></p>
    <div class="summary"><span>Цена</span><strong id="product-price"></strong></div>
    <form class="dialog-actions" method="dialog">
      <button class="secondary" autofocus>Закрыть</button>
    </form>
  </dialog>

  <template id="product-template">
    <li class="product">
      <div class="product-details">
        <h2><button class="product-name" type="button" data-detail></button></h2>
        <p class="category"></p>
      </div>
      <strong class="product-price"></strong>
      <button class="primary" type="button">В корзину</button>
    </li>
  </template>

  <template id="cart-template">
    <li class="cart-row">
      <div class="item-text"><h3></h3><p></p></div>
      <div class="qty">
        <button class="icon-button" type="button" data-change="-1">−</button>
        <span></span>
        <button class="icon-button" type="button" data-change="1">+</button>
      </div>
      <strong class="line-total"></strong>
      <button class="remove" type="button" data-remove>Удалить</button>
    </li>
  </template>

  <noscript>Для работы корзины включите JavaScript.</noscript>
</body>
</html>
